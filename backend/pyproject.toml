[project]
name = "portfolio-backend"
version = "0.1.0"
description = "FastAPI backend for the R.J. Verdan Tayam portfolio"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.3.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revision files are generated stamps — lint the app, not history.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Pinned explicitly so CI behavior never drifts with ruff's evolving defaults:
# pycodestyle core (E4/E7/E9), pyflakes (F), import sorting (I),
# pyupgrade (UP), bugbear (B), ruff-specific (RUF).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Seed data is user-facing prose: intentional typography (en dashes in
# published copy) is content, not ambiguous input.
"app/seed.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection puts Depends()/Form()/File()/Query() in
# parameter defaults by design — allow the framework idiom, keep B008 for
# everything else (e.g. datetime.now() in defaults).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
